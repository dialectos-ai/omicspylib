# Scans the locked dependencies (uv.lock) for known vulnerabilities using pip-audit,
# which checks packages against the PyPI / OSV advisory databases.

name: dependency vulnerability audit

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # weekly, so newly disclosed advisories are caught even without dependency changes
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: runtime
            export-flags: "--no-dev"
          - scope: all-groups
            export-flags: "--all-groups"

    name: pip-audit (${{ matrix.scope }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        python-version: "3.13"
    - name: Export locked requirements
      run: |
        uv export --frozen --format requirements-txt --no-emit-project ${{ matrix.export-flags }} > requirements-audit.txt
    - name: Audit dependencies with pip-audit
      run: |
        uvx pip-audit --requirement requirements-audit.txt --require-hashes --disable-pip --strict --progress-spinner off
