# Weekly dependency updates, opened as PRs against develop so they are
# tested by the regular CI (python-app.yml) before merging.
# Note: Dependabot *security* updates ignore target-branch and always target the
# default branch, so keep them disabled in repo settings and rely on these
# weekly version updates (plus Dependabot alerts) instead.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
